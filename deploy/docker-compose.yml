services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: serk_construction
    ports: ["5432:5432"]
    volumes:
      - ./00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["/serk-migrate"]
    environment:
      SERK_ADMIN_DSN: postgres://postgres:postgres@db:5432/serk_construction?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERK_APP_DSN: postgres://serk_api:serk_api@db:5432/serk_construction?sslmode=disable
      SERK_TOKEN_SECRET: change-me-to-a-random-32-byte-or-longer-secret
      SERK_LISTEN: ":8080"
    ports: ["8080:8080"]
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  pgdata:
