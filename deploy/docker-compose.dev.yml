# DEVELOPMENT ONLY. Every secret below is a published, well-known value and
# every port is bound to 127.0.0.1. The API refuses these values unless
# SERK_ENV=development. Never deploy this file; use docker-compose.prod.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev-only-postgres-password-not-for-production
      POSTGRES_DB: serk_construction
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ./01-dev-passwords.sql:/docker-entrypoint-initdb.d/01-dev-passwords.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/serk-migrate"]
    environment:
      SERK_ADMIN_DSN: postgres://postgres:dev-only-postgres-password-not-for-production@db:5432/serk_construction?sslmode=disable
    depends_on: { db: { condition: service_healthy } }
  signer:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/serk-signer"]
    environment:
      SERK_ENV: development
      SERK_SIGNER_SOCKET: /run/serk/signer.sock
      SERK_APPROVAL_SIGNING_KEY: dev-only-approval-signing-key-0123456789abcdefABCDEF
      SERK_TOKEN_SECRET: dev-only-hs256-token-secret-0123456789abcdefABCDEF
    volumes: [signer_sock:/run/serk]
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERK_ENV: development
      SERK_SIGNER_SOCKET: /run/serk/signer.sock
      SERK_DB_BASE_DSN: postgres://db:5432/serk_construction?sslmode=disable
      SERK_HEALTH_DSN: postgres://serk_health:dev-only-health-password@db:5432/serk_construction?sslmode=disable
      SERK_TENANT_DB_SECRET: dev-only-tenant-db-secret-0123456789abcdefABCDEF
      SERK_TOKEN_SECRET: dev-only-hs256-token-secret-0123456789abcdefABCDEF
      SERK_SCHEDULER_DSN: postgres://serk_timer:dev-only-timer-password@db:5432/serk_construction?sslmode=disable
      SERK_ABUSE_DSN: postgres://serk_ratelimit:dev-only-ratelimit-password@db:5432/serk_construction?sslmode=disable
      SERK_ABUSE_KEY: dev-only-abuse-hmac-key-0123456789abcdefABCDEF
      SERK_BANK_DATA_KEY: dev-only-bank-data-key-0123456789abcdefABCDEF
      SERK_LISTEN: ":8080"
    ports: ["127.0.0.1:8080:8080"]
    volumes: [signer_sock:/run/serk]
    depends_on: { migrate: { condition: service_completed_successfully }, signer: { condition: service_started } }
volumes:
  pgdata:
  signer_sock:
