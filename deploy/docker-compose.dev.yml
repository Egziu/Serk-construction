# DEVELOPMENT ONLY. Every secret below is a published, well-known value and
# every port is bound to 127.0.0.1. The API refuses these values unless
# SERK_ENV=development. Never deploy this file; use docker-compose.prod.yml.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev-only-postgres-password-not-for-production
      POSTGRES_DB: serk_construction
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - ./00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["/serk-migrate"]
    environment:
      SERK_ADMIN_DSN: postgres://postgres:dev-only-postgres-password-not-for-production@db:5432/serk_construction?sslmode=disable
    depends_on: { db: { condition: service_healthy } }
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      SERK_ENV: development
      SERK_DB_BASE_DSN: postgres://db:5432/serk_construction?sslmode=disable
      SERK_HEALTH_DSN: postgres://serk_health:dev-only-health-password@db:5432/serk_construction?sslmode=disable
      SERK_TENANT_DB_SECRET: dev-only-tenant-db-secret-0123456789abcdefABCDEF
      SERK_TOKEN_SECRET: dev-only-hs256-token-secret-0123456789abcdefABCDEF
      SERK_LISTEN: ":8080"
    ports: ["127.0.0.1:8080:8080"]
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes:
  pgdata:
