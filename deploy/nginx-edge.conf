# Edge controls for the production profile, nginx variant (GATEA-10).
#
# STATUS: written, NOT executed. No nginx or staging environment exists in
# the build environment, so this configuration has not been load-tested or
# even started. Treat it as a reviewed draft for the staging deployment, not
# as evidence.
#
# What it adds in front of the API (which keeps its own shared limits,
# migration 0029, as the second line):
#   - per-client request rate (leaky bucket) and connection caps at the edge,
#     keyed by client address; IPv6 clients are keyed by /64 to match the API;
#   - a stricter bucket for authentication-adjacent paths;
#   - request body cap, header timeouts, TLS 1.2+, HSTS;
#   - X-Forwarded-For set from the edge only (the API trusts only the proxy
#     network, SERK_TRUSTED_PROXIES).
# Volumetric attacks beyond this host's capacity need upstream (provider)
# scrubbing; that is outside the application and outside this file.

worker_processes auto;
events { worker_connections 4096; }

http {
    # Key: IPv4 address as is; IPv6 truncated to its /64 (same rule as the
    # API's abuse limiter, R9-F6).
    map $remote_addr $client_key {
        default                              $remote_addr;
        "~^(?<p>[0-9a-fA-F:]+:[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):" $p;
    }
    limit_req_zone  $client_key zone=api_rps:20m   rate=20r/s;
    limit_req_zone  $client_key zone=auth_rps:10m  rate=5r/s;
    limit_conn_zone $client_key zone=api_conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    client_max_body_size 1m;
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          30s;
    keepalive_timeout     60s;
    server_tokens off;

    upstream serk_api { server api:8080; keepalive 32; }

    server {
        listen 443 ssl http2;
        server_name api.example.serk;           # replace with the real name
        ssl_certificate     /run/secrets/edge_tls_cert;
        ssl_certificate_key /run/secrets/edge_tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

        limit_conn api_conn 50;

        # Everything the API serves; the API's own per-principal budget
        # applies after authentication.
        location / {
            limit_req zone=api_rps burst=40 nodelay;
            proxy_pass http://serk_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;   # never append client-supplied values
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 30s;
        }
        # Pre-authentication surface (token-bearing requests that fail cheaply
        # are the credential-stuffing path): tighter bucket.
        location ~ ^/v1/(sessions|auth) {
            limit_req zone=auth_rps burst=10 nodelay;
            proxy_pass http://serk_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
        }
        location /metrics { return 404; }   # internal listener only
    }
}
