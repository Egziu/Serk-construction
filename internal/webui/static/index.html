<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>SERK Construction — Operations</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top" role="banner">
  <div class="brand"><span class="mark" aria-hidden="true"></span><span>SERK Construction</span></div>
  <div class="who" id="who" hidden>
    <span id="who-name"></span>
    <span id="who-mfa" class="chip" hidden>MFA</span>
    <button type="button" id="signout" class="ghost">Sign out</button>
  </div>
</header>
<div class="shell">
  <nav id="nav" aria-label="Main" hidden></nav>
  <main id="main" tabindex="-1">
    <div id="alert" role="alert" class="alert" hidden></div>
    <div id="status" role="status" aria-live="polite" class="sr"></div>
    <div id="view"></div>
  </main>
</div>
<noscript><p class="pad">The SERK console needs JavaScript.</p></noscript>
</body>
</html>
