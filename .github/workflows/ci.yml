name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: serk_construction }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.24" }
      - name: Create application roles
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d serk_construction -v ON_ERROR_STOP=1 -f deploy/00-roles.sql
      - run: make fmt vet
      - run: make test-unit
      - run: make test-integration
        env:
          ADMIN_DSN: postgres://postgres:postgres@localhost:5432/serk_construction?sslmode=disable
          APP_DSN: postgres://serk_api:serk_api@localhost:5432/serk_construction?sslmode=disable
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - run: make build
